services:
  # ----------------------------------------------------------------------------
  # Redis In-Memory Distributed Cache (Query & Embedding Caching)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rag_redis_cache
    ports:
      - "${REDIS_HOST_PORT:-6382}:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # ChromaDB Vector Database
  # ----------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: rag_chroma_db
    ports:
      - "8005:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Enterprise Spring Boot RAG Ingestion Pipeline Application
  # ----------------------------------------------------------------------------
  rag-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextgem/smart-rag-platform:1.0.0
    container_name: smart_rag_platform_app
    ports:
      - "${RAG_PORT:-8082}:8080"
    volumes:
      # Mount host data folder to persist PDFs, H2 DB, staging, and vectors
      - ./data:/app/data
    environment:
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_URL=http://chromadb:8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RAG_LLM_GEMINI_API_KEY=${RAG_LLM_GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - RAG_LLM_PROVIDER=${RAG_LLM_PROVIDER:-AUTO}
      - RAG_LLM_MODEL=${RAG_LLM_MODEL:-}
      - JAVA_OPTS=-server -Xms256m -Xmx1024m -XX:MaxDirectMemorySize=512m -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -XX:G1ReservePercent=15 -XX:InitiatingHeapOccupancyPercent=45 -Dorg.apache.pdfbox.rendering.UsePureJava=true -Dfile.encoding=UTF-8
    depends_on:
      - chromadb
      - redis
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
