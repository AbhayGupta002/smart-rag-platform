server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:250}
      min-spare: 30
    accept-count: ${TOMCAT_ACCEPT_COUNT:1000}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    connection-timeout: 20000ms

spring:
  application:
    name: smart-rag-platform
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 2000ms
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 2GB
  datasource:
    url: jdbc:h2:file:./data/pipeline_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# ==============================================================================
# Enterprise High-Throughput RAG Pipeline Configuration
# Optimized for Cross-Platform (Windows, macOS, Linux) & 1,000 Concurrent Users
# ==============================================================================
rag:
  # Query Engine Concurrency & Backpressure
  query:
    max-concurrency: ${RAG_QUERY_MAX_CONCURRENCY:128}
    max-queue-depth: ${RAG_QUERY_MAX_QUEUE_DEPTH:500}
    queue-timeout-ms: ${RAG_QUERY_QUEUE_TIMEOUT_MS:5000}

  pipeline:
    # Separate dedicated process directories
    base-dir: "data"
    raw-pdf-dir: "data/raw_pdfs"
    staging-md-dir: "data/staging_md"
    chunked-jsonl-dir: "data/chunked_jsonl"
    vector-storage-dir: "data/vector_storage"

    # Parallelism & Concurrency (mapped to system hardware)
    max-concurrency: 8

    # Memory Safety Guardrail (MB)
    # If heap exceeds this threshold, workers throttle to avoid OOM
    memory-safety-threshold-mb: 6144

    # RAG Chunking Parameters
    chunk-size: 1200
    chunk-overlap: 50

    # Chroma Vector Database Settings
    chroma-url: "${CHROMA_URL:http://localhost:8005}"
    chroma-collection: "rag_documents"

# ==============================================================================
# LLM Configuration for RAG Answer Generation
# Supports: Google Gemini API, Local Ollama, or Extractive Fallback
# ==============================================================================
  llm:
    provider: "${RAG_LLM_PROVIDER:AUTO}"
    endpoint: "${RAG_LLM_ENDPOINT:http://localhost:11434/api/generate}"
    model: "${RAG_LLM_MODEL:}"
    # Groq API Key (100% Free tier at console.groq.com - recommended)
    groq-api-key: "${GROQ_API_KEY:}"
    # Google Gemini API key (Free tier at aistudio.google.com)
    gemini-api-key: "${RAG_LLM_GEMINI_API_KEY:${GEMINI_API_KEY:}}"
    # OpenRouter API key (Free models at openrouter.ai)
    openrouter-api-key: "${OPENROUTER_API_KEY:}"

logging:
  level:
    root: INFO
    com.nextgem.smartrag: DEBUG
    org.apache.pdfbox: WARN
